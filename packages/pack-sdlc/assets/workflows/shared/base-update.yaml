# Shared steps — shipped in the sdlc pack; a repo copy under .agents/workflows/shared/ replaces it. A workflow brings them in with `use: base-update`.
# Brings the story branch up to date with its base after the work, tests the merged tree, and takes
# the light path when only the base moved.
# Change the `test` step's `check:` to your repo's test command; the light path's test steps copy it (`like: test`).
# Exits: `tested` (the full path's test passed), `broken` (a test failed: implement's work, which then
# takes the full path), `ship` (the light path is done: open the PR), `redescribe` (pr.md's merge
# danger changed).
description: Update the story branch from its base, test the merged tree, take the light path when only the base moved.
start: update
steps:
  # the light path: when the story holds only base merges and spec-folder bookkeeping (never spec.md)
  # since the round's latest approve, a merge git made alone (clean) or one a resolver finished
  # (resolved) skips implement and the full review and describe; anything else is done, the full path
  # (only an approve the PR already holds counts: open-pr ran after it, or it is at ready or merge;
  # so a base move before the PR is out never skips a gate or describe)
  update:
    update-branch:
    outcomes:
      done: test
      clean: test-merge
      resolved: test-resolution
      conflict: resolve
  resolve:
    agent: "Base mode: merge the base commit the base_side input names into the story branch in this worktree, resolve, commit the merge; never rebase. When Rework holds the resolution review's findings instead, fix the resolution they name and commit; never rebase."
    skills: [norn-merge]
    inputs: [spec, handoff, base_side]
    outcomes:
      done: update
    means:
      done: "base merged into the story branch, conflicts resolved and committed"
  test:
    check: bun test
    timeout: 15m
    outcomes: { pass: { exit: tested }, fail: { exit: broken } }
  # the light path's tests run the same command
  test-merge:
    like: test
    outcomes: { pass: { exit: ship }, fail: { exit: broken } }
  test-resolution:
    like: test
    outcomes: { pass: resolution-review, fail: { exit: broken } }
  # reviews only what the resolver changed (each merge's remerge-diff), never the whole story again
  resolution-review:
    agent: >-
      Review only the resolution: each remerge-diff under Inputs is where a merge differs from git's own
      merge of its parents, a base change the resolver dropped included. Judge whether it keeps the intent
      of both sides. Report `redescribe` when the merge danger pr.md describes no longer holds.
    skills: [norn-review]
    inputs: [spec, resolution]
    hand_back: { changes_requested: findings }
    outcomes:
      approve:           { exit: ship }
      redescribe:        { exit: redescribe }
      changes_requested: { to: resolve, max: 2 }
    means:
      approve: "the resolution keeps both sides' intent, no blocking findings; pr.md still describes the merge danger"
      redescribe: "the resolution is sound, but the merge danger pr.md describes changed"
      changes_requested: "blocking findings on the resolution, handed back with --findings <file>"
