# Use after the work, before publishing. Exits: `tested`, `failed` (a test failed: back to the
# work, which then takes the full path), `merged` (the light path is through: open the PR at
# `open-pr`), `redescribe` (the merge danger pr.md describes changed).
description: Update the story branch from its base, test the merged tree, take the light path when only the base moved.
start: update
steps:
  # the light path: when the story holds only base merges and spec-folder bookkeeping (never spec.md)
  # since its pull request last took the branch (the remote story branch, which only the steps that
  # publish the change move), a merge git made alone (clean) or one a resolver finished (resolved)
  # skips implement and the full review and describe; anything else is done, the full path (so does a
  # story with no open pull request, or whose remote branch took commits a person pushed: those were
  # never reviewed, so a base move never skips a gate or describe for them)
  update:
    by: vcs.update-branch
    outcomes:
      done: test
      clean: test-merge
      resolved: test-resolution
      conflict: resolve
  resolve:
    by: builder
    do: "Merge the base into the story branch in this worktree, in the mode the skill picks from your inputs; never rebase."
    with: { skills: [norn-merge] }
    reads: [spec, handoff, base_side]
    outcomes:
      done:
        to: update
        means: "base merged into the story branch, conflicts resolved and committed"
  test:
    by: shell
    do: "{checks.test}"
    limits: { timeout: 15m }
    outcomes: { pass: { exit: tested }, fail: { exit: failed } }
  # the light path's tests run the same command
  test-merge:
    like: test
    outcomes: { pass: { exit: merged }, fail: { exit: failed } }
  test-resolution:
    like: test
    outcomes: { pass: resolution-review, fail: { exit: failed } }
  # reviews only what the resolver changed (each merge's remerge-diff), never the whole story again
  resolution-review:
    by: reviewer
    do: >-
      Review only the resolution: each remerge-diff under Inputs is where a merge differs from git's own
      merge of its parents, a base change the resolver dropped included. Judge whether it keeps the intent
      of both sides. Report `redescribe` when the merge danger pr.md describes no longer holds.
    with: { skills: [norn-review] }
    reads: [spec, resolution]
    outcomes:
      approve:
        exit: merged
        means: "the resolution keeps both sides' intent, no blocking findings; pr.md still describes the merge danger"
      redescribe:
        exit: redescribe
        means: "the resolution is sound, but the merge danger pr.md describes changed"
      changes_requested:
        to: resolve
        max: 2
        means: "blocking findings on the resolution, handed back as findings"
        produces: [findings]
