# Use before any work, so it starts from the current base and the base update after it merges only
# what moved meanwhile.
description: Merge the base into the story branch before the work starts, resolving conflicts.
start: sync
steps:
  sync:
    by: vcs.update-branch
    # a branch that already held its base (clean) or took it in after a resolve (resolved) is synced too
    outcomes: { done: { exit: synced }, conflict: sync-resolve, clean: { exit: synced }, resolved: { exit: synced } }
  sync-resolve:
    by: builder
    do: "Merge the base into the story branch in this worktree, in the mode the skill picks from your inputs; never rebase."
    with: { skills: [norn-merge] }
    reads: [spec, handoff, base_side]
    outcomes:
      done:
        to: sync
        means: "base merged into the story branch, conflicts resolved and committed"
