# Use for the work itself and every rework of it; the base update or the slice's integrate comes next.
# Exit: `reviewed` (checked and reviewed, no blocking findings).
description: Build the change test-first, run the test check, review the diff.
start: implement
steps:
  implement:
    by: builder
    do: >-
      Build what this unit is for, test-first, and keep to it: the slice file's acceptance criteria in a
      slice, else the Plan section of spec.md, else the issue mirrored in spec.md and its latest `## Triage`
      or `## Reproduce` comment; and every rework point the inputs name (a red check, review findings, a QA
      repro, a failed PR check, a person's rejection).
    with: { skills: [norn-implement] }
    reads: [slice?, spec, handoff, last_check, findings?]
    outcomes:
      done:
        to: check
        means: "every behaviour change and rework point has a passing test"
  check:
    by: shell
    do: "{checks.test}"
    limits: { timeout: 15m }
    outcomes: { pass: review, fail: implement }
  review:
    by: reviewer
    do: >-
      Review the diff against what it was built for (the slice file's acceptance criteria in a slice, else
      the story's Plan, or the issue and its latest triage or reproduce comment) and the findings it
      reworks: it does that and nothing else.
    with: { skills: [norn-review] }
    reads: [slice?, spec, diff, findings?]
    outcomes:
      approve:
        exit: reviewed
        means: "it does what it was built for and nothing else, no blocking findings"
      changes_requested:
        to: implement
        means: "blocking findings, handed back as findings"
        produces: [findings]
