# Shared steps — shipped in the sdlc pack; a repo copy under .agents/workflows/shared/ replaces it. A workflow brings them in with `use: ship`.
# Opens the draft PR (or rewrites the body of the open one), waits for the PR's CI, waits for a person
# at ready, marks the PR ready for review, then waits at merge until a person merges the PR.
# Exits: `ci-failed` (a red CI check), `rejected` (a person rejected at ready), `stale` (the base moved
# under the story in a way that conflicts: the workflow sends it back through its base update).
description: Open the draft PR, wait for its CI, wait for a person at ready and at merge.
start: open-pr
steps:
  open-pr:
    open-pr:
    outcomes: { done: ci }
  # waits for the checks on the PR's head commit, as the forge reports them: no check within the grace
  # means the repo has no CI and passes (at once on a forge without checks); a red check's failures
  # become last_check for implement, whose rework goes back through open-pr to the new head. A PR that
  # conflicts with its base runs no CI: the base check behind `stale` sends it to its base update.
  # CI still pending past the deadline parks the story for a person.
  ci:
    await: [ci.passed, ci.failed, ci.none]
    deadline: 30m
    grace: 5m
    outcomes: { ci.passed: ready, ci.none: ready, ci.failed: { exit: ci-failed }, stale: { exit: stale } }
  ready:
    gate: "Read the draft PR. Approve to wait for the merge (a person merges the PR), or reject with what to change."
    outcomes:
      approve: mark-ready
      reject:  { exit: rejected }
      stale:   { exit: stale }
      # the story branch holds commits its PR lacks: push them through open-pr before a person merges
      unpushed: open-pr
  # a forge merges no draft: the PR is marked ready for review once the person approves at ready
  mark-ready:
    mark-ready:
    outcomes: { done: merge }
  # a story past ready waits here for a person to merge its PR; the merge onto the story's base ends
  # the story, and a base move it counts as stale (base.stale) leaves through `stale` by itself
  merge:
    await: [change.merged]
    outcomes:
      change.merged: $done
      stale: { exit: stale }
      unpushed: open-pr
