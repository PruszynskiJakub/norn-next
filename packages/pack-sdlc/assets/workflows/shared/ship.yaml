# Shared steps — shipped in the sdlc pack; a repo copy under .agents/workflows/shared/ replaces it. A workflow brings them in with `use: ship`.
# Opens the draft PR (or rewrites the body of the open one), waits for the PR's CI, waits for a person
# at ready, then waits at merge until a person merges the PR.
# Exits: `ci-failed` (a red CI check), `rejected` (a person rejected at ready), `stale` (the base moved
# under the story in a way that conflicts: the workflow sends it back through its base update).
description: Open the draft PR, wait for its CI, wait for a person at ready and at merge.
start: open-pr
steps:
  open-pr:
    open-pr:
    outcomes: { done: ci }
  # waits for the checks on the PR's head commit (a detached check run, so the tick is not blocked):
  # up to 5m for a first check to appear, none means the repo has no CI and passes; a red check's
  # failures' whereabouts become last_check for implement, whose rework goes back through open-pr to the new head.
  # GitHub (gh) only, and passes with no GitHub remote: on GitLab replace the script, or route open-pr's done straight to ready.
  ci:
    check: |
      command -v gh >/dev/null || { echo "gh not found: no CI to wait for"; exit 0; }
      # a repo with no GitHub remote (forge none, a local origin) has no PR and so no CI; any other gh failure fails
      if ! out=$(gh repo view --json name 2>&1); then
        case "$out" in *"none of the git remotes"*|*"no git remotes found"*) echo "no GitHub remote: no CI to wait for"; exit 0 ;; esac
        echo "$out"; exit 1
      fi
      pr=$(gh pr view --json number -q .number) || exit 1
      sha=$(gh pr view --json headRefOid -q .headRefOid) || exit 1
      # GitHub starts no CI run on a PR that conflicts with its base: exit 3 is stale, the story
      # updates its branch instead of waiting. UNKNOWN is GitHub still computing: asked again briefly.
      mergeable() {
        m=UNKNOWN
        for i in 1 2 3 4 5 6; do
          m=$(gh pr view "$pr" --json mergeable -q .mergeable) || return 1
          [ "$m" != UNKNOWN ] && return 0
          sleep 5
        done
      }
      conflicting() { [ "$m" = CONFLICTING ] && echo "PR conflicts with its base: no CI runs on it until the branch takes the base"; }
      mergeable || exit 1
      conflicting && exit 3
      n=0
      for i in $(seq 1 30); do
        n=$(gh pr view "$pr" --json statusCheckRollup -q '.statusCheckRollup | length') || exit 1
        [ "$n" -gt 0 ] && break
        sleep 10
      done
      if [ "$n" -eq 0 ]; then
        mergeable || exit 1
        conflicting && exit 3
        echo "no checks on PR #$pr after 5m (PR mergeable: $m): nothing to wait for"
        exit 0
      fi
      gh pr checks "$pr" --watch --interval 30 >/dev/null && exit 0
      gh pr checks "$pr"
      # where the failures are, never the log: a failed step's log buries the failure in passing output
      gh api "repos/{owner}/{repo}/commits/$sha/check-runs?per_page=100" -q '.check_runs[] | select(.conclusion=="failure") | "- \(.name) (id \(.id)): \(.details_url)"'
      echo "Read a failed check run's annotations (file, line, message):"
      echo "  gh api \"repos/{owner}/{repo}/check-runs/<id>/annotations\" -q '.[] | select(.annotation_level==\"failure\" and .path!=\".github\") | \"\\(.path):\\(.start_line) \\(.message)\"'"
      echo "Only if that is not enough, the full log is behind its link."
      exit 1
    timeout: 30m
    exits: { 3: stale }
    outcomes: { pass: ready, fail: { exit: ci-failed }, stale: { exit: stale } }
  ready:
    gate: "Read the draft PR. Approve to wait for the merge (a person merges the PR), or reject with what to change."
    outcomes:
      approve: merge
      reject:  { exit: rejected }
      stale:   { exit: stale }
      # the story branch holds commits its PR lacks: push them through open-pr before a person merges
      unpushed: open-pr
  # a story past ready waits here for a person to merge its PR, marked ready for review first (a forge
  # merges no draft); the merge ends the story, and a base move it counts as stale (base.stale) leaves
  # through `stale` by itself
  merge:
    await-merge:
    outcomes:
      merged: $done
      stale: { exit: stale }
      unpushed: open-pr
