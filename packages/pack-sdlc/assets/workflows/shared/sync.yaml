# Shared steps — shipped in the sdlc pack; a repo copy under .agents/workflows/shared/ replaces it. A workflow brings them in with `use: sync`.
# Brings the story branch up to date with its base before any work starts, so the work starts from
# the current base and a later update merges only what moved meanwhile.
# Exit `synced`: the branch holds the base.
description: Bring the story branch up to date with its base before the work starts.
start: sync
steps:
  sync:
    update-branch:
    # a branch that already held its base (clean) or took it in after a resolve (resolved) is synced too
    outcomes: { done: { exit: synced }, conflict: sync-resolve, clean: { exit: synced }, resolved: { exit: synced } }
  sync-resolve:
    agent: "Base mode: merge the base commit the base_side input names into the story branch in this worktree, resolve, commit the merge; never rebase."
    skills: [norn-merge]
    inputs: [spec, handoff, base_side]
    outcomes:
      done: sync
    means:
      done: "base merged into the story branch, conflicts resolved and committed"
