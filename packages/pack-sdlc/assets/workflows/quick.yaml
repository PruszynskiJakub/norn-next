name: quick
description: Make a small change (refactor, docs, chore, a reproduced bug's fix), check and review it, open the draft PR, wait for CI.
when: >-
  For refactors, docs, chores and other small changes, and the fix of a bug a reproduce round
  confirmed. A merged PR ends the story.
start: catch-up
steps:
  catch-up:
    use: catch-up
    outcomes: { synced: build }
  build:
    use: build
    outcomes: { reviewed: base-update }
  base-update:
    use: base-update
    outcomes:
      tested: publish
      failed: build
      merged: open-pr
      redescribe: publish
  # a failed check's rework goes back through open-pr to the new head
  publish:
    use: publish
    outcomes:
      passed: land
      failed: { to: build, max: 3 }
      stale: base-update
  land:
    use: land
    outcomes:
      rejected: build
      stale: base-update
      unpushed: open-pr
# `norn story update-branch` enters the base update, not catch-up (the first update-branch step); a base
# move without a conflict under a story waiting at ready or merge runs `test` on the merged tree, once
# per base move (no push, no CI): red goes back through the base update like a conflict
signals: { vcs.stale: { when: conflict, verify: test } }
entries: { update-branch: base-update }
