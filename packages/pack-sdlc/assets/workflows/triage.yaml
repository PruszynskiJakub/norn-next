# The first round of a new issue. Next round: the one its comment recommends (`norn story round
# <story> --workflow refinement|quick|reproduce`), or closing the issue.
name: triage
description: Check an issue still holds, add its context, and recommend what comes next (refinement, quick, reproduce) or closing it.
start: explore
steps:
  explore:
    by: investigator
    do: >-
      The issue is mirrored in spec.md. Post the `## Triage` comment on it and add the kind, risk and priority
      labels: `norn:kind:bug|feature|security|chore|docs`, `norn:risk:low|medium|high`,
      `norn:priority:low|medium|high|extreme`; a label missing on the remote is named in the comment
      for a person to create. That comment and those labels are the only remote writes this step allows,
      an exception to the brief's rule on remote writes; never remove a label, the intake label `norn` included. Change no file, spec.md included,
      but the handoff. The recommendation lives only in that comment:
      report `norn done done --note "<recommendation>: <reason>"`.
    with: { skills: [norn-triage] }
    reads: [spec, handoff]
    outcomes:
      done:
        to: $done
        means: "the ## Triage comment is posted, with one recommendation (refinement, quick, reproduce or close) and its reason, and the kind, risk and priority labels that could be set are on the issue"
