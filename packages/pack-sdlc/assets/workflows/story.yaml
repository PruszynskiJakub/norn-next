# For a story a refinement round planned; start it with `norn story round <story> --workflow story`.
# A merged PR ends the story.
name: story
description: Slice a planned story against the current base, run the slices, verify the story, open the draft PR, wait for CI.
start: catch-up
steps:
  catch-up:
    use: catch-up
    outcomes: { synced: slice }
  slice:
    by: writer
    do: >-
      Write slice files to slices/<nn>-<slug>.md in the spec folder. A slice has no QA of its own: list every
      slice's criteria in spec.md's frontmatter `criteria` too, each id prefixed with its slice number
      (`01.AC1`), next to the story's own, so the story's QA gives each one a verdict. First check the Plan section of spec.md
      against the code on this base: when spec.md has no Plan section, or the base changed what the plan
      relies on so that it no longer holds, write no slice files, say what no longer holds in the handoff's
      Notes and report `replan`.
    with: { skills: [norn-slice] }
    reads: [spec, slices]
    outcomes:
      done:
        to: approve-slices
        means: "slice files written against the current base; every user story is covered by some slice's acceptance"
      replan:
        to: $stuck
        means: "spec.md has no Plan, or the base no longer fits it: what no longer holds is in the handoff; the person replans it in a refinement round from its plan step (norn story round <story> --workflow refinement --at plan)"
  approve-slices:
    by: person
    do: "Review the slice files in the spec folder (edit them if needed). Approve to start the slices, or reject with what to change."
    outcomes: { approve: slices, reject: { to: slice, max: 3 } }
  slices:
    by: norn.each
    reads: [slices]
    outcomes: { done: base-update, stuck: $stuck }
  base-update:
    use: base-update
    outcomes:
      tested: qa
      failed: build
      merged: open-pr
      redescribe: publish
  qa:
    by: qa
    do: "The criteria are spec.md's frontmatter `criteria`; an id `<nn>.<id>` is criterion `<id>` of slice file `<nn>-*.md`, which says what it means."
    with: { skills: [norn-qa] }
    reads: [spec, slices, diff]
    # a criteria report with every outcome, and only the outcome matching its worst verdict
    produces: [criteria]
    outcomes:
      pass:
        to: publish
        verdict: pass
        means: "every acceptance criterion of the story and its slices observed with evidence"
      fail:
        to: build
        counter: qa_loop
        verdict: fail
        means: "a criterion fails; its repro in the criteria report, and the findings handed back as findings"
        produces: [criteria, findings]
      partial:
        to: human-qa
        verdict: person
        means: "criteria only a person can judge, evidence prepared"
      unverified:
        to: human-qa
        verdict: unverified
        means: "criteria this session could not check; how to check each one is in the report"
  human-qa:
    by: person
    do: "Check the criteria QA could not settle (listed with how to check each). Approve, or reject with what failed."
    outcomes:
      approve: publish
      reject:  { to: build, counter: qa_loop }
    on:
      vcs.stale: base-update
  # every rework is built, then goes through the base update, so it is tested on the current base
  build:
    use: build
    outcomes: { reviewed: base-update }
  # a failed check's rework goes back through open-pr to the new head
  publish:
    use: publish
    outcomes:
      passed: land
      failed: { to: build, max: 3 }
      stale: base-update
  land:
    use: land
    outcomes:
      rejected: build
      stale: base-update
      unpushed: open-pr
counters:
  # QA's fail and the person's reject at human-qa share one budget
  qa_loop: { max: 2 }
# `norn story update-branch` enters the base update, not catch-up (the first update-branch step); a base
# move without a conflict under a story waiting at human-qa, ready or merge runs `test` on the merged
# tree, once per base move (no push, no CI): red goes back through the base update like a conflict
signals: { vcs.stale: { when: conflict, verify: test } }
entries: { update-branch: base-update }
