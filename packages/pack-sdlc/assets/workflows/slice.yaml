name: slice
description: Build one slice test-first, check and review it, and integrate it into the story branch.
when: >-
  Runs on each slice a story workflow cuts; the story's qa checks the slice's criteria, once.
start: build
steps:
  build:
    use: build
    outcomes: { reviewed: integrate }
  integrate:
    by: vcs.integrate
    outcomes: { done: $done, conflict: merge }
  merge:
    by: builder
    do: "Slice mode: integrating this slice into the story branch conflicted; merge the story branch's commit the base_side input names into this slice in this worktree, resolve each conflict keeping the intent of both sides, prove it with the tests and commit the merge; never rebase."
    with: { skills: [norn-merge] }
    reads: [slice, spec, base_side]
    outcomes:
      done:
        to: integrate
        means: "conflicts resolved keeping the intent of both sides; tests pass"
