# Slice workflow — shipped in the sdlc pack; a repo copy under .agents/workflows/ replaces it.
# Runs on a slice: build test-first, check, review, then integrate into the story branch.
# A slice has no QA of its own: its criteria stay in its file and the story's qa checks them all, once.
# The `test` step runs the config's `checks.test` (norn config set checks.test "<command>"; default bun test).
name: slice
description: Build one slice test-first, check and review it, and integrate it into the story branch.
start: implement
steps:
  implement:
    agent: "Build this slice test-first: each acceptance criterion in the slice file, or each rework point from a red check or a review, ends with a passing test. Stay inside the slice; later slices have their own steps."
    skills: [norn-implement]
    inputs: [slice, spec, handoff, last_check, last_findings]
    outcomes:
      done:
        to: test
        means: "every acceptance criterion (or rework point) has a passing test"
  test:
    check: "{checks.test}"
    timeout: 10m
    outcomes: { pass: review, fail: implement }
  review:
    agent: "Review this slice's diff against its acceptance criteria and the spec, before it integrates into the story branch."
    skills: [norn-review]
    writes: docs
    inputs: [slice, spec, diff, last_findings]
    outcomes:
      approve:
        to: integrate
        means: "all criteria met, no blocking findings"
      changes_requested:
        to: implement
        means: "blocking findings, handed back with --findings <file>"
        produces: [findings]
  integrate:
    integrate:
    outcomes: { done: $done, conflict: merge }
  merge:
    agent: "Slice mode: integrating this slice into the story branch conflicted; merge the story branch's commit the base_side input names into this slice in this worktree, resolve each conflict keeping the intent of both sides, prove it with the tests and commit the merge; never rebase."
    skills: [norn-merge]
    inputs: [slice, spec, base_side]
    outcomes:
      done:
        to: integrate
        means: "conflicts resolved keeping the intent of both sides; tests pass"
