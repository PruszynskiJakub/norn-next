name: refinement
description: Agree a story's spec and plan with a person, against the current base; no code.
when: >-
  For a story that needs a spec and a plan before code. No gate: starting the next round (`norn story
  round <story> --workflow story|quick`) approves the plan; `--workflow refinement --at plan` reworks it.
start: catch-up
steps:
  # the spec and plan are written against the current base
  catch-up:
    use: catch-up
    outcomes: { synced: refine }
  refine:
    by: writer
    do: "Write the spec into the body of spec.md; keep its frontmatter unchanged."
    with: { skills: [norn-refine] }
    attended: person
    reads: [spec, handoff]
    outcomes:
      done:
        to: plan
        means: "spec complete: problem statement, solution, numbered user stories, out of scope; no open questions"
      questions:
        to: clarify
        means: "spec written, but open questions are listed that need the person's answers"
  clarify:
    by: writer
    do: "Settle the spec's open questions with the person, one question at a time, folding each answer into the section it changes."
    with: { skills: [norn-clarify] }
    attended: person
    reads: [spec, handoff]
    outcomes:
      done:
        to: plan
        means: "every open question is answered and folded into the spec"
  plan:
    by: writer
    do: "Write the Plan section of spec.md."
    with: { skills: [norn-plan] }
    attended: person
    reads: [spec, handoff]
    outcomes:
      done:
        to: $done
        means: "spec.md's Plan section has seams, a coverage table for every user story, prefactoring, decisions and risks"
