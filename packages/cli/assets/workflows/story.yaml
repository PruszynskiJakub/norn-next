# Story workflow — example installed by `norn init`; edit freely.
# Delivers a story whose spec and plan a refinement round agreed: bring the story up to date with its
# base, cut slices from the plan against that base, approve them, run the slices, bring the story up
# to date again, verify the whole story once (QA over every slice's criteria), describe it, open the
# draft PR (or rewrite the body of the open one), wait for the PR's CI, wait for a person at ready,
# then wait at merge until a person merges the PR.
# Rework found by the story-level test, QA, CI or a person is done in the story worktree and reviewed
# before it is checked again.
# QA reports a verdict per acceptance criterion (criteria: required) and may only report the outcome
# matching its worst verdict; `unverified` (could not check here) goes to a person at human-qa.
# A story waiting at human-qa, ready or merge goes back through update when the base moved
# under it in a way that conflicts (base.stale; `behind` re-updates on any base commit).
# Change `test.run` to your repo's test command; the light path's test steps reuse it (`*test-run`).
name: story
description: Slice a planned story against the current base, run the slices, verify the story, open the draft PR, wait for CI.
start: sync
steps:
  # brings the story branch up to date with its base before the slices are cut, so they are cut
  # against the code they will change
  sync:
    type: git
    action: update
    outcomes: { done: slice, conflict: { to: sync-resolve, counter: sync_conflict_loop } }
  sync-resolve:
    type: agent
    skill: norn-merge
    inputs: [spec, handoff]
    instructions: "Base mode: merge the base commit named in Rework into the story branch in this worktree, resolve, commit the merge; never rebase."
    outcomes:
      done: { to: sync, means: "base merged into the story branch, conflicts resolved and committed" }
  slice:
    type: agent
    skill: norn-slice
    inputs: [spec, slices]
    instructions: >-
      Write slice files to slices/<nn>-<slug>.md in the spec folder. A slice has no QA of its own: list every
      slice's criteria in spec.md's frontmatter `criteria` too, each id prefixed with its slice number
      (`01.AC1`), next to the story's own, so the story's QA gives each one a verdict. First check the Plan section of spec.md
      against the code on this base: when spec.md has no Plan section, or the base changed what the plan
      relies on so that it no longer holds, write no slice files, say what no longer holds in the handoff's
      Notes and report `replan`.
    outcomes:
      done:   { to: approve-slices, means: "slice files written against the current base; every user story is covered by some slice's acceptance" }
      replan: { to: $stuck, means: "spec.md has no Plan, or the base no longer fits it: what no longer holds is in the handoff; the person replans with `norn story edit <story> --workflow refinement --at plan`" }
  approve-slices:
    type: gate
    prompt: "Review the slice files in the spec folder (edit them if needed). Approve to start the slices, or reject with what to change."
    outcomes: { approve: slices, reject: { to: slice, counter: slice_loop } }
  slices:
    type: slices
    outcomes: { done: update, stuck: $stuck }
  # the light path: when the story holds only base merges and spec-folder bookkeeping (never spec.md)
  # since the round's latest approve, a merge git made alone (clean) or one a resolver finished
  # (resolved) skips implement and the full review and describe; anything else is done, the full path
  update:
    type: git
    action: update
    outcomes:
      done: test
      clean: test-merge
      resolved: test-resolution
      conflict: { to: resolve, counter: base_conflict_loop }
  resolve:
    type: agent
    skill: norn-merge
    inputs: [spec, handoff, base_side]
    instructions: "Base mode: merge the base commit named in Rework into the story branch in this worktree, resolve, commit the merge; never rebase. When Rework holds the resolution review's findings instead, fix the resolution they name and commit; never rebase."
    outcomes:
      done: { to: update, means: "base merged into the story branch, conflicts resolved and committed" }
  test:
    type: check
    run: &test-run bun test
    timeout: 15m
    outcomes: { pass: qa, fail: { to: implement, counter: test_loop } }
  # the light path's tests run the same command (the anchor above); red is implement's work, which
  # then takes the full path
  test-merge:
    type: check
    run: *test-run
    timeout: 15m
    outcomes: { pass: open-pr, fail: { to: implement, counter: test_loop } }
  test-resolution:
    type: check
    run: *test-run
    timeout: 15m
    outcomes: { pass: resolution-review, fail: { to: implement, counter: test_loop } }
  # reviews only what the resolver changed (each merge's remerge-diff), never the whole story again
  resolution-review:
    type: agent
    skill: norn-review
    inputs: [spec, resolution]
    instructions: >-
      Review only the resolution: each remerge-diff under Inputs is where a merge differs from git's own
      merge of its parents, a base change the resolver dropped included. Judge whether it keeps the intent
      of both sides. Report `redescribe` when the merge danger pr.md describes no longer holds.
    outcomes:
      approve:           { to: open-pr, means: "the resolution keeps both sides' intent, no blocking findings; pr.md still describes the merge danger" }
      redescribe:        { to: describe, means: "the resolution is sound, but the merge danger pr.md describes changed" }
      changes_requested: { to: resolve, counter: resolution_loop, means: "blocking findings on the resolution in the receipt" }
  qa:
    type: agent
    skill: norn-qa
    inputs: [spec, slices, diff]
    criteria: required
    instructions: "The criteria are spec.md's frontmatter `criteria`; an id `<nn>.<id>` is criterion `<id>` of slice file `<nn>-*.md`, which says what it means."
    outcomes:
      pass:       { to: describe, verdict: pass, means: "every acceptance criterion of the story and its slices observed with evidence" }
      fail:       { to: implement, counter: qa_loop, verdict: fail, means: "a criterion fails; repro in findings" }
      partial:    { to: human-qa, verdict: person, means: "criteria only a person can judge, evidence prepared" }
      unverified: { to: human-qa, verdict: unverified, means: "criteria this session could not check; how to check each one is in the report" }
  human-qa:
    type: gate
    prompt: "Check the criteria QA could not settle (listed with how to check each). Approve, or reject with what failed."
    outcomes:
      approve: describe
      reject:  { to: implement, counter: qa_loop }
      stale:   { to: update, counter: stale_loop }
  implement:
    type: agent
    skill: norn-implement
    inputs: [spec, handoff, last_check, last_findings]
    outcomes:
      done: { to: review, means: "every rework point has a passing test" }
  # only rework reaches implement, and slices are reviewed before they integrate: this reviews the
  # story-level rework, so a round without rework never runs it
  review:
    type: agent
    skill: norn-review
    inputs: [spec, diff, last_findings]
    outcomes:
      approve:           { to: test, means: "the rework does what the findings and the story ask and nothing else, no blocking findings" }
      changes_requested: { to: implement, counter: review_loop, means: "blocking findings in the receipt" }
  describe:
    type: agent
    skill: norn-pr
    inputs: [spec, diff, record]
    instructions: "Write the PR body to pr.md in the spec folder; norn puts the issue link under it."
    outcomes:
      done: { to: open-pr, means: "pr.md describes the branch as it is now: summary, evidence, merge danger" }
  open-pr:
    type: git
    action: open-pr
    outcomes: { done: ci }
  # waits for the checks on the PR's head commit (a detached check run, so the tick is not blocked):
  # up to 5m for a first check to appear, none means the repo has no CI and passes; a red check's
  # failures' whereabouts become last_check for implement, whose rework goes back through open-pr to the new head.
  # GitHub (gh) only: on GitLab replace the script, or route open-pr's done straight to ready.
  ci:
    type: check
    run: |
      command -v gh >/dev/null || { echo "gh not found: no CI to wait for"; exit 0; }
      pr=$(gh pr view --json number -q .number) || exit 1
      sha=$(gh pr view --json headRefOid -q .headRefOid) || exit 1
      # GitHub starts no CI run on a PR that conflicts with its base: exit 3 is stale, the story
      # updates its branch instead of waiting. UNKNOWN is GitHub still computing: asked again briefly.
      mergeable() {
        m=UNKNOWN
        for i in 1 2 3 4 5 6; do
          m=$(gh pr view "$pr" --json mergeable -q .mergeable) || return 1
          [ "$m" != UNKNOWN ] && return 0
          sleep 5
        done
      }
      conflicting() { [ "$m" = CONFLICTING ] && echo "PR conflicts with its base: no CI runs on it until the branch takes the base"; }
      mergeable || exit 1
      conflicting && exit 3
      n=0
      for i in $(seq 1 30); do
        n=$(gh pr view "$pr" --json statusCheckRollup -q '.statusCheckRollup | length') || exit 1
        [ "$n" -gt 0 ] && break
        sleep 10
      done
      if [ "$n" -eq 0 ]; then
        mergeable || exit 1
        conflicting && exit 3
        echo "no checks on PR #$pr after 5m (PR mergeable: $m): nothing to wait for"
        exit 0
      fi
      gh pr checks "$pr" --watch --interval 30 >/dev/null && exit 0
      gh pr checks "$pr"
      # where the failures are, never the log: a failed step's log buries the failure in passing output
      gh api "repos/{owner}/{repo}/commits/$sha/check-runs?per_page=100" -q '.check_runs[] | select(.conclusion=="failure") | "- \(.name) (id \(.id)): \(.details_url)"'
      echo "Read a failed check run's annotations (file, line, message):"
      echo "  gh api \"repos/{owner}/{repo}/check-runs/<id>/annotations\" -q '.[] | select(.annotation_level==\"failure\" and .path!=\".github\") | \"\\(.path):\\(.start_line) \\(.message)\"'"
      echo "Only if that is not enough, the full log is behind its link."
      exit 1
    timeout: 30m
    exits: { 3: stale }
    outcomes: { pass: ready, fail: { to: implement, counter: ci_loop }, stale: { to: update, counter: stale_loop } }
  ready:
    type: gate
    prompt: "Read the draft PR. Approve to wait for the merge (a person merges the PR), or reject with what to change."
    outcomes:
      approve: merge
      reject:  { to: implement, counter: ready_loop }
      stale:   { to: update, counter: stale_loop }
  # a story past ready waits here for a person to merge its PR; the merge ends the story, and a base
  # move it counts as stale (base.stale) sends it back through update by itself
  merge:
    type: merge
    outcomes:
      stale: { to: update, counter: stale_loop }
counters:
  slice_loop: { max: 3 }
  test_loop: { max: 5 }
  ci_loop: { max: 3 }
  qa_loop: { max: 2 }
  ready_loop: { max: 2 }
  review_loop: { max: 3 }
  # reset each time their update merges cleanly (on either path): only repeated conflicts on one base move count
  sync_conflict_loop: { max: 2, reset_on: sync.done }
  base_conflict_loop: { max: 2, reset_on: [update.done, update.clean, update.resolved] }
  resolution_loop: { max: 2 }
  # a stale re-entry is progress from outside (a sibling merged), bounded by the sibling merges
  stale_loop: { max: 10 }
# update-branch re-enters update, not sync (the default would be the first update step)
base: { stale: conflict, step: update }
