# yaml-language-server: $schema=norn.config.schema.json
# norn team config: .agents/norn.config.yaml (committed: what the team agrees on)
#
# Run `norn config` to see every setting in effect and where it came from.
# Three files, each with its own keys:
#   ~/.norn/config.yaml              this machine (max_agents, notify, trace) and your defaults (mode, agent, agents)
#   .agents/norn.config.local.yaml   you, in this repo (mode, agent, agents): overrides your user file; gitignored
#   .agents/norn.config.yaml         this file: the team (provider, base_branch, workflow, slice_workflow, regenerate)
# Everything else has no key: norn detects it, derives it or fixes it.
#
# Every key is optional. A commented value is the built-in default.

# Where stories come from: gh (GitHub) | glab (GitLab). Unset: read from the remote URL.
# provider: gh

# The branch stories are cut from and PR'd into. Unset: the remote's default branch.
# base_branch: main

# Workflows in .agents/workflows/. An issue label norn:wf:<name> picks another one per story.
# workflow: triage
# slice_workflow: slice

# Generated files and the command that writes them: a base update whose conflicts are all such
# files takes the base's version, runs the command and commits the merge, with no agent. Commands
# hold up the tick (timeout 2m unless set), so keep them fast and deterministic.
# regenerate: [{ paths: ["docs/api/*.md"], run: npm run docs, timeout: 2m }]
