# Release workflow — repo-local, for the story a person starts with /release-start
# (label norn:wf:release). A story workflow without `slices`: every step works in
# the story worktree. Prepare the release (changelog from the commits on the base since the last
# tag, proposed version, version bumps, pr.md), open the draft PR, wait for the PR's CI (tests incl.
# the stale-schema test, typecheck, npm package and a binary built and smoke-tested) and wait for a
# person at `ready`, who judges the version and the changelog there; the person merges the PR, and
# CI smokes every binary on its own OS, tags and publishes on that merge.
# Any commit on the base makes the changelog incomplete (base.stale: behind): a release
# waiting at `ready` goes back through update and prepare. A red CI means the base is
# broken: the story goes $stuck; fix the base in its own story, then
# `norn run rerun gh-N --step update`.
name: release
description: Write the changelog and propose the version, open the draft PR, wait for its CI, and let a person judge it at ready.
start: prepare
steps:
  prepare:
    type: agent
    skill: release
    inputs: [spec, handoff]
    instructions: >-
      Write the changelog section, the version bumps and the proposed version with its reason as the
      skill says; a version given in the issue's `## Version` or by the person in Rework wins over
      your proposal. Also write the PR body to pr.md in the spec folder: the proposed version, its
      reason and the new changelog section; norn puts the issue link under it. In the same diff as
      the bump, set `norn_version: X.Y.Z` in .agents/norn.config.yaml by editing the file (not with
      `norn upgrade`, which runs only in the main checkout) and copy packages/cli/assets/skills/norn*
      over .agents/skills/norn* as the skill says, so that once the PR merges the published binary is
      the one main asks for. Rename the issue to "Release X.Y.Z" with `gh issue edit`, the one remote
      write this step allows. Change no code.
    outcomes:
      done: { to: open-pr, means: "CHANGELOG.md, packages/cli/package.json, the README badge and norn_version in .agents/norn.config.yaml carry version X.Y.Z, .agents/skills/norn* match the bundled sources; pr.md and the handoff name it with its reason" }
  update:
    type: git
    action: update
    outcomes: { done: prepare, conflict: { to: resolve, counter: base_conflict_loop } }
  resolve:
    type: agent
    skill: norn-merge
    inputs: [spec, handoff]
    instructions: "Base mode: merge the base commit named in Rework into the story branch in this worktree, resolve, commit the merge; never rebase. CHANGELOG.md and version conflicts: keep the base side; prepare writes the release section again next."
    outcomes:
      done: { to: update, means: "base merged into the story branch, conflicts resolved and committed" }
  open-pr:
    type: git
    action: open-pr
    outcomes: { done: ci }
  # waits for the PR's CI (a detached check run, so the tick is not blocked): the ci.yml run of the
  # PR's head commit, up to 5m for it to appear, else fail: tests, typecheck, the
  # npm package and a binary built and smoke-tested; release.yml smokes every binary on its own OS
  # after the merge, before it pushes the tag
  ci:
    type: check
    run: |
      sha=$(gh pr view --json headRefOid -q .headRefOid) || exit 1
      # GitHub starts no CI run on a PR that conflicts with its base: exit 3 is stale, the story
      # updates its branch instead of waiting. UNKNOWN is GitHub still computing: asked again briefly.
      mergeable() {
        m=UNKNOWN
        for i in 1 2 3 4 5 6; do
          m=$(gh pr view --json mergeable -q .mergeable) || return 1
          [ "$m" != UNKNOWN ] && return 0
          sleep 5
        done
      }
      conflicting() { [ "$m" = CONFLICTING ] && echo "PR conflicts with its base: no CI runs on it until the branch takes the base"; }
      mergeable || exit 1
      conflicting && exit 3
      run=
      for i in $(seq 1 30); do
        run=$(gh run list --workflow ci.yml --commit "$sha" --event pull_request --limit 1 --json databaseId -q '.[0].databaseId')
        [ -n "$run" ] && break
        sleep 10
      done
      if [ -z "$run" ]; then
        mergeable || exit 1
        conflicting && exit 3
        echo "no ci.yml run for $sha after 5m (PR mergeable: $m)"
        exit 1
      fi
      gh run watch "$run" --exit-status --interval 30 >/dev/null && exit 0
      sh .agents/scripts/ci-failures.sh "$run"
      exit 1
    timeout: 30m
    exits: { 3: stale }
    outcomes: { pass: ready, fail: $stuck, stale: { to: update, counter: stale_loop } }
  ready:
    type: gate
    prompt: >-
      Read the draft release PR: the proposed version and its reason, and the new CHANGELOG.md section.
      Approve to mark the release finished (a person merges the PR; CI then tags and publishes), or
      reject with the version or changelog changes you want.
    outcomes:
      approve: $done
      reject:  { to: prepare, counter: ready_loop }
      stale:   { to: update, counter: stale_loop }
counters:
  ready_loop: { max: 2 }
  # resets each time update merges cleanly: only repeated conflicts on one base move count
  base_conflict_loop: { max: 2, reset_on: update.done }
  # a stale re-entry is progress from outside (a commit landed on the base), bounded by those commits
  stale_loop: { max: 10 }
base: { stale: behind }
