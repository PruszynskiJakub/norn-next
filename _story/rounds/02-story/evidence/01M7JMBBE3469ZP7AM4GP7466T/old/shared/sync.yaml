# Shared steps — installed by `norn init`; edit freely. A workflow brings them in with `use: sync`.
# Brings the story branch up to date with its base before any work starts, so the work starts from
# the current base and a later update merges only what moved meanwhile.
# Exit `synced`: the branch holds the base. The workflow declares `sync_conflict_loop`.
description: Bring the story branch up to date with its base before the work starts.
start: sync
steps:
  sync:
    type: git
    action: update
    outcomes: { done: { exit: synced }, conflict: { to: sync-resolve, counter: sync_conflict_loop } }
  sync-resolve:
    type: agent
    skill: norn-merge
    inputs: [spec, handoff]
    instructions: "Base mode: merge the base commit named in Rework into the story branch in this worktree, resolve, commit the merge; never rebase."
    outcomes:
      done: { to: sync, means: "base merged into the story branch, conflicts resolved and committed" }
