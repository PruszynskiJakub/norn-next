# norn's Herdr plugin (HC9): the interactive cockpit pane and two actions.
# Link it once:  herdr plugin link <norn checkout>/plugins/herdr
id = "norn"
name = "norn"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "norn cockpit: act on the inbox and jump to the agent that waits for you"
platforms = ["linux", "macos"]

# `norn pane --interactive` in the repo of the pane it was opened from.
[[panes]]
id = "cockpit"
title = "norn"
placement = "split"
command = ["sh", "cockpit.sh"]

# Opens the cockpit below the focused pane without taking focus. Bind it to a key:
#   [[keys.command]]
#   key = "prefix+n"
#   type = "plugin_action"
#   command = "norn.open"
[[actions]]
id = "open"
title = "Open the norn cockpit"
contexts = ["workspace"]
command = ["sh", "open.sh"]

# Focuses the agent pane of the oldest Your turn item (`norn pane --next`); a toast when none.
#   [[keys.command]]
#   key = "prefix+N"
#   type = "plugin_action"
#   command = "norn.next"
[[actions]]
id = "next"
title = "Go to the agent waiting for you"
contexts = ["workspace"]
command = ["sh", "next.sh"]
