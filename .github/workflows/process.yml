# The process check: every PR to main is a norn story PR, a bypass, or a Dependabot update.
# Required by branch protection under the check name "process". The rule lives in
# scripts/process-check.ts (tested in test/repo/process-check.test.ts):
#   (a) head branch gh-<N>-<slug> and the PR closes #N;
#   (b) PR labelled `bypass`, closes an issue labelled `bypass` that links another issue;
#   (c) author dependabot[bot].
# pull_request_target, not pull_request: this workflow file and the script both come from the base
# branch, so a PR cannot change the rule it is checked by. Safe because nothing from the PR runs:
# the job checks out only the base commit, never the head, and its token is read-only.
# Changing the bypass issue's labels or body does not re-run the check: re-run it, or edit the PR.
name: process

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]

concurrency:
  group: process-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  process:
    name: process
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Check the PR comes from norn, the bypass or Dependabot
        run: |
          if [ ! -f scripts/process-check.ts ]; then
            msg='{"error":"this PR predates the process check: its base commit has no scripts/process-check.ts","do_instead":"Update the branch from main (rebase or merge), then the check runs."}'
            echo "$msg"
            echo "::error title=process::this PR predates the process check. Update the branch from main, then the check runs."
            exit 3
          fi
          bun scripts/process-check.ts "$PR"
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
