# Dependabot PRs merge themselves once the required checks pass: patch and minor updates get
# auto-merge (squash); a major update waits for the maintainer. Needs "Allow auto-merge" in the
# repository settings and required checks on main, else `gh pr merge --auto` has nothing to wait for.
name: dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Leave a major update to the maintainer
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::major update of $DEPS, review and merge it by hand"
        env:
          DEPS: ${{ steps.meta.outputs.dependency-names }}
