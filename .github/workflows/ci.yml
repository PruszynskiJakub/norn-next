# Every PR and every push to main: the unit tier and the type check first, then the integration
# tier in shards and the distributables built and smoke-tested as a user would install them, side by
# side.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The unit tier spawns nothing and fails in seconds; every other job waits for it.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck

  # bun shards by file; the only place the integration tier runs, so no local check waits on it. The
  # lab suites run in the lab job instead. The flags replace the integration config's ignore patterns,
  # so they repeat them before the lab's.
  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: integration (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Integration tier, one shard
        run: |
          git config --global user.name "norn ci"
          git config --global user.email "ci@norn.invalid"
          git config --global init.defaultBranch main
          bun run test:integration --shard=${{ matrix.shard }}/4 --path-ignore-patterns='packages/*/test/*.ts' --path-ignore-patterns='packages/*/test/{[!i]*,i[!n]*}/**' --path-ignore-patterns='packages/cli/test/integration/lab*.test.ts'

  # one runner per lab suite: each plays a whole lab of real processes, and a lab beside other suites
  # on one runner starves every suite there past its timeout
  lab:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [lab]
    name: integration (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Integration tier, one lab suite
        run: |
          git config --global user.name "norn ci"
          git config --global user.email "ci@norn.invalid"
          git config --global init.defaultBranch main
          bun run test:integration packages/cli/test/integration/${{ matrix.suite }}.test.ts

  package:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          bun scripts/build.ts
          bun scripts/build.ts --bin linux-x64
      - name: Smoke-test the npm package installed from its tarball
        run: |
          git config --global user.name "norn ci"
          git config --global user.email "ci@norn.invalid"
          version=$(jq -r .version packages/cli/package.json)
          (cd dist/npm && npm pack --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          echo '{"name":"app","private":true}' > package.json
          bun add "$RUNNER_TEMP"/norn-cli-*.tgz
          "$GITHUB_WORKSPACE/scripts/smoke.sh" node_modules/.bin/norn "$version"
      - name: Smoke-test the linux-x64 binary
        run: scripts/smoke.sh dist/bin/norn-linux-x64 "$(jq -r .version packages/cli/package.json)"
