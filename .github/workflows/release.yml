# Release on a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must match packages/cli/package.json and have a `## [x.y.z]` section in CHANGELOG.md.
# build → smoke (every binary on its own OS) → publish @pruszynskijakub/norn to GitHub Packages
# and a GitHub release with the binaries. A PR that touches the release machinery, or a run by
# hand (workflow_dispatch), builds and smokes without publishing.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/build.ts", "scripts/smoke.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Check the tag against the package version and changelog
        id: version
        run: |
          version=$(jq -r .version packages/cli/package.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME != packages/cli/package.json $version"; exit 1; }
          fi
          mkdir -p dist
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || { echo "CHANGELOG.md has no ## [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile

      - name: Test
        run: |
          git config --global user.name "norn ci"
          git config --global user.email "ci@norn.invalid"
          git config --global init.defaultBranch main
          bun test
          bun run typecheck

      - name: Build
        run: |
          bun scripts/build.ts --name @pruszynskijakub/norn --registry https://npm.pkg.github.com
          bun scripts/build.ts --bin
          (cd dist/bin && sha256sum norn-* > SHA256SUMS)

      - name: Smoke-test the bundle and the linux-x64 binary
        run: |
          scripts/smoke.sh dist/bin/norn-linux-x64 "${{ steps.version.outputs.version }}"
          scripts/smoke.sh dist/npm/norn.js "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/npm
            dist/bin
            dist/notes.md
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Smoke-test norn-${{ matrix.target }} on its own OS
        run: |
          chmod +x dist/bin/norn-${{ matrix.target }}
          scripts/smoke.sh dist/bin/norn-${{ matrix.target }} "${{ needs.build.outputs.version }}"

  publish:
    needs: [build, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@pruszynskijakub"

      - name: Publish to GitHub Packages
        working-directory: dist/npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub release
        run: |
          chmod +x dist/bin/norn-*
          gh release create "$GITHUB_REF_NAME" dist/bin/* --title "norn $GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
