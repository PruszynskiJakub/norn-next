# Every change to norn starts as an issue. A collaborator adds the `norn` label and assigns the
# issue to themselves only when work on it should begin: norn takes it in then (GR1) and cuts its
# branch from the base at that moment (GR2). The bug report template only routes: it sets
# norn:wf:reproduce so a bug starts in `reproduce` instead of `triage` (W9); the rest is left to them.
blank_issues_enabled: true
contact_links:
  - name: How to contribute
    url: https://github.com/PruszynskiJakub/norn-next/blob/main/CONTRIBUTING.md
    about: How a change reaches norn, and what happens to a pull request from a fork.
