# Fix workflow — repo-local, for a defect triage confirmed (W1, W9: label norn:wf:fix).
# A story workflow without `slices` (W8): every step works in the story worktree.
# Reproduce and diagnose first, fix test-first, bring the story up to date with its base,
# check, review, describe, open the draft PR (or rewrite the body of the open one), and wait
# for a person at `ready`; the person merges the PR.
# A story waiting at ready goes back through update when the base moved under it in a way
# that conflicts (BS6–BS8, base.stale: conflict).
name: fix
description: Reproduce a defect and find its cause, fix it test-first, review it, open the draft PR.
start: reproduce
steps:
  reproduce:
    type: agent
    skill: norn-diagnose
    inputs: [spec, handoff]
    instructions: >-
      Start from the triage findings in the issue's latest `## Triage` comment (`gh issue view <N> --comments`). First follow the report as a user, through the real
      interface (`bun packages/cli/src/main.ts …`, never the installed `norn`), and record what you saw.
      Run that dev build only in a throwaway git repo under $TMPDIR, never in this worktree: it is a live norn unit (NORN_HOME points at it) and a dev build would act on its runs/, claim and state.json.
      Then build a loop that goes red on that exact symptom, minimise it and confirm the cause. Do not
      fix anything. Under Progress in the handoff (the next agent does not see your Resume), give the
      loop command, the minimised repro, the confirmed cause (or the ranked hypotheses left) and the
      seam for a regression test; attach the user-side evidence and the loop's red output.
    outcomes:
      reproduced:       { to: implement, means: "the defect was observed as a user and a loop goes red on it; repro, loop and cause in the handoff, evidence attached" }
      cannot_reproduce: { to: $stuck, means: "followed the report faithfully and the defect did not occur, nor in any loop tried; what was tried is attached" }
  implement:
    type: agent
    skill: norn-implement
    inputs: [spec, handoff, last_check, last_findings]
    instructions: "Start from the loop and minimised repro in the handoff: turn them into a failing test at the seam named there before changing any code, then fix the cause. Cite the PRD ids the fix enforces."
    outcomes:
      done: { to: update, means: "the repro (and each rework point) is a passing test" }
  update:
    type: git
    action: update
    outcomes: { done: test, conflict: { to: resolve, counter: base_conflict_loop } }
  resolve:
    type: agent
    skill: norn-merge
    inputs: [spec, handoff]
    instructions: "Base mode: merge the base commit named in Rework into the story branch in this worktree, resolve, commit the merge; never rebase."
    outcomes:
      done: { to: update, means: "base merged into the story branch, conflicts resolved and committed" }
  test:
    type: check
    run: "bun install --frozen-lockfile && bun run test && bun run typecheck"
    timeout: 15m
    outcomes: { pass: review, fail: { to: implement, counter: test_loop } }
  review:
    type: agent
    skill: norn-review
    inputs: [spec, diff]
    outcomes:
      approve:           { to: describe, means: "the fix addresses the cause, no blocking findings" }
      changes_requested: { to: implement, counter: review_loop, means: "blocking findings in the receipt" }
  describe:
    type: agent
    skill: norn-pr
    inputs: [spec, diff, handoff]
    instructions: "Write the PR body to pr.md in the spec folder; norn puts the issue link under it. Evidence: the repro before (red) and after (green)."
    outcomes:
      done: { to: open-pr, means: "pr.md describes the branch as it is now: summary, evidence, merge danger" }
  open-pr:
    type: git
    action: open-pr
    outcomes: { done: ready }
  ready:
    type: gate
    prompt: "Read the draft PR. Approve to mark the story finished (a person still merges the PR), or reject with what to change."
    outcomes:
      approve: $done
      reject:  { to: implement, counter: ready_loop }
      stale:   { to: update, counter: stale_loop }
counters:
  test_loop: { max: 5 }
  review_loop: { max: 3 }
  ready_loop: { max: 2 }
  # resets each time update merges cleanly: only repeated conflicts on one base move count (W4)
  base_conflict_loop: { max: 2, reset_on: update.done }
  # a stale re-entry is progress from outside (a sibling merged), bounded by the sibling merges
  stale_loop: { max: 10 }
base: { stale: conflict }
