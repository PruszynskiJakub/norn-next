# Refinement workflow — repo-local copy of the shipped one. Brings the story up to date with its
# base, then refines the spec, settles its open questions and plans it, all with a person. No gate:
# starting the next round (`norn story round <story> --workflow story|quick`) is the person's approval
# of the plan; rework is `norn story round <story> --workflow refinement --at plan`.
name: refinement
description: Agree a story's spec and plan with a person, against the current base; no code.
start: sync
steps:
  sync:
    update-branch:
    # a branch that already held its base (clean) or took it in after a resolve (resolved) goes on to refine too
    outcomes: { done: refine, conflict: sync-resolve, clean: refine, resolved: refine }
  sync-resolve:
    agent: "Base mode: merge the base commit the base_side input names into the story branch in this worktree, resolve, commit the merge; never rebase."
    skills: [norn-merge]
    inputs: [spec, handoff, base_side]
    outcomes:
      done: sync
    means:
      done: "base merged into the story branch, conflicts resolved and committed"
  refine:
    agent: "Write the spec into the body of spec.md; keep its frontmatter unchanged."
    skills: [norn-refine]
    attended: true
    inputs: [spec, handoff]
    outcomes:
      done:      plan
      questions: clarify
    means:
      done: "spec complete: problem statement, solution, numbered user stories, out of scope; no open questions"
      questions: "spec written, but open questions are listed that need the person's answers"
  clarify:
    agent: "Settle the spec's open questions with the person, one question at a time, folding each answer into the section it changes."
    skills: [norn-clarify]
    attended: true
    inputs: [spec, handoff]
    outcomes:
      done: plan
    means:
      done: "every open question is answered and folded into the spec"
  plan:
    agent: "Write the Plan section of spec.md."
    skills: [norn-plan]
    attended: true
    inputs: [spec, handoff]
    outcomes:
      done: $done
    means:
      done: "spec.md's Plan section has seams, a coverage table for every user story, prefactoring, decisions and risks"
