# The pack's slice with this repo's check command; runs on each slice a story cuts.
name: slice
description: Build one slice test-first, check and review it, and integrate it into the story branch.
start: implement
steps:
  implement:
    by: builder
    do: >-
      Build this slice test-first: each acceptance criterion in the slice file, or each rework point from a red
      check or a review, ends with a passing test. Stay inside the slice; later slices have their own steps.
      Run `bun run test` (the unit tier) after each change, and the type check; this slice's `test` check runs
      only those two: the integration tier runs in CI, once the story's PR is open, so do not run them
      before handing back.
    with: { skills: [norn-implement] }
    reads: [slice, spec, handoff, last_check, findings?]
    outcomes:
      done:
        to: test
        means: "every acceptance criterion (or rework point) has a passing test"
  test:
    by: shell
    do: "bun install --frozen-lockfile && bun run test && bun run typecheck"
    limits: { timeout: 15m }
    outcomes: { pass: review, fail: implement }
  review:
    by: reviewer
    do: "Review this slice's diff against its acceptance criteria and the spec, before it integrates into the story branch."
    with: { skills: [norn-review] }
    reads: [slice, spec, diff, findings?]
    outcomes:
      approve:
        to: integrate
        means: "all criteria met, no blocking findings"
      changes_requested:
        to: implement
        means: "blocking findings, handed back as findings"
        produces: [findings]
  integrate:
    by: vcs.integrate
    outcomes: { done: $done, conflict: merge }
  merge:
    by: builder
    do: "Slice mode: integrating this slice into the story branch conflicted; merge the story branch's commit the base_side input names into this slice in this worktree, resolve each conflict keeping the intent of both sides, prove it with the tests and commit the merge; never rebase."
    with: { skills: [norn-merge] }
    reads: [slice, spec, base_side]
    outcomes:
      done:
        to: integrate
        means: "conflicts resolved keeping the intent of both sides; tests pass"
