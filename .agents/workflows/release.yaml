# For the release story a person starts with /release-start (label norn:wf:release). The person
# judges the version and changelog at ready and merges; CI tags and publishes on the merge. A red
# check means the base is broken: fix it in its own story, then `norn run rerun gh-N --step sync`.
name: release
description: "For the release story a person starts with /release-start: write the changelog and propose the version, open the draft PR, wait for its CI, and let a person judge it at ready."
start: catch-up
steps:
  # the changelog covers every commit on the base, so the release starts from the current base
  catch-up:
    use: catch-up
    outcomes: { synced: prepare }
  prepare:
    # it writes CHANGELOG.md, the version bumps and the skill copies, so it needs the builder's code:write
    by: builder
    do: >-
      Write the changelog section, the version bumps and the proposed version with its reason as the
      skill says, over whatever a merge of the base left in CHANGELOG.md and the versions; a version given
      in the issue's `## Version` or in the reject at ready (under Rework) wins over your proposal. Also
      write the PR body to pr.md in the spec folder: the proposed version, its reason and the new changelog
      section; norn puts the issue link under it. In the same diff as the bump, copy
      packages/pack-sdlc/assets/skills/norn* over .agents/skills/norn* as the skill says, so that once the
      PR merges the repo's skill copies match the published binary. Rename the issue to "Release X.Y.Z"
      with `gh issue edit`, the one remote write this step allows. Change no code.
    with: { skills: [release] }
    reads: [spec, handoff]
    # open-pr reads it; norn done refuses the report while pr.md is missing or empty
    produces: [{ name: pr_body, file: pr.md }]
    outcomes:
      done:
        to: open-pr
        means: "CHANGELOG.md, packages/cli/package.json and the README badge carry version X.Y.Z, .agents/skills/norn* match the bundled sources; pr.md and the handoff name it with its reason"
  # prepare writes pr.md, so the release opens its PR without the pack's describe (shared/publish.yaml,
  # whose every step must be reachable). release.yml smokes every binary on its own OS after the
  # merge, before it pushes the tag
  open-pr:
    by: forge.open-pr
    outcomes: { done: checks }
  checks:
    by: forge.await-checks
    outcomes: { pass: land, fail: $stuck, stale: catch-up }
  land:
    use: land
    outcomes: { rejected: prepare, stale: catch-up, unpushed: open-pr }
# any commit on the base makes the changelog incomplete, so a release waiting at ready or merge
# catches up and prepares again
signals: { vcs.stale: { when: behind } }
