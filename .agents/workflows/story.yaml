# Story workflow — repo-local copy of the shipped one, with this repo's check commands and its
# ci.yml wait, its common steps taken from this repo's shared/ files. Delivers a story a refinement
# round planned: sync, cut slices against the current base, approve them, run the slices, update, check, QA the whole story once, describe, open the draft PR,
# wait for its CI, wait for a person at ready, then at merge for the PR's merge. The local check runs the unit tier and the type
# check; CI runs the integration tier sharded. Story-level rework is reviewed before it is
# checked again.
# QA reports a verdict per acceptance criterion (produces: [criteria]) and may only report the outcome
# matching its worst verdict.
# A story waiting at human-qa, ready or merge goes back through update when the base moved under it in a way
# that conflicts (vcs.stale under signals:).
name: story
description: Slice a planned story against the current base, run the slices, verify the story, open the draft PR, wait for CI.
start: catch-up
steps:
  # brings the story branch up to date with its base before the slices are cut, so they are cut
  # against the code they will change
  catch-up:
    use: sync
    outcomes: { synced: slice }
  slice:
    by: writer
    do: >-
      Write slice files to slices/<nn>-<slug>.md in the spec folder. A slice has no QA of its own: list every
      slice's criteria in spec.md's frontmatter `criteria` too, each id prefixed with its slice number
      (`01.AC1`), next to the story's own, so the story's QA gives each one a verdict. First check the Plan section of spec.md
      against the code on this base: when spec.md has no Plan section, or the base changed what the plan
      relies on so that it no longer holds, write no slice files, say what no longer holds in the handoff's
      Notes and report `replan`.
    with: { skills: [norn-slice] }
    reads: [spec, slices]
    outcomes:
      done:
        to: approve-slices
        means: "slice files written against the current base; every user story is covered by some slice's acceptance"
      replan:
        to: $stuck
        means: "spec.md has no Plan, or the base no longer fits it: what no longer holds is in the handoff; the person replans it in a refinement round from its plan step (norn story round <story> --workflow refinement --at plan)"
  approve-slices:
    by: person
    do: "Review the slice files in the spec folder (edit them if needed). Approve to start the slices, or reject with what to change."
    outcomes: { approve: slices, reject: { to: slice, max: 3 } }
  slices:
    by: norn.each
    outcomes: { done: update, stuck: $stuck }
  base-update:
    use: base-update
    outcomes: { tested: qa, failed: implement, merged: open-pr, redescribe: describe }
  qa:
    by: qa
    do: "The criteria are spec.md's frontmatter `criteria`; an id `<nn>.<id>` is criterion `<id>` of slice file `<nn>-*.md`, which says what it means."
    with: { skills: [norn-qa] }
    reads: [spec, slices, diff]
    # a criteria report with every outcome, and only the outcome matching its worst verdict
    produces: [criteria]
    outcomes:
      pass:
        to: describe
        verdict: pass
        means: "every acceptance criterion of the story and its slices observed with evidence"
      fail:
        to: implement
        counter: qa_loop
        verdict: fail
        means: "a criterion fails; its repro in the criteria report, and the findings handed back as findings"
        produces: [criteria, findings]
      partial:
        to: human-qa
        verdict: person
        means: "criteria only a person can judge, evidence prepared"
      unverified:
        to: human-qa
        verdict: unverified
        means: "criteria this session could not check; how to check each one is in the report"
  human-qa:
    by: person
    do: "Check the criteria QA could not settle (listed with how to check each). Approve, or reject with what failed."
    outcomes:
      approve: describe
      reject:  { to: implement, counter: qa_loop }
    on:
      vcs.stale: { to: update, counter: stale_loop }
  implement:
    by: builder
    do: "Run `bun run test` (the unit tier) after each change, and the type check; the integration tier runs in CI, which the `ci` check waits for, so do not run them before handing back."
    with: { skills: [norn-implement] }
    reads: [spec, handoff, last_check, findings?]
    outcomes:
      done:
        to: review
        means: "every rework point has a passing test"
  # only rework reaches implement, and slices are reviewed before they integrate: this reviews the
  # story-level rework, so a round without rework never runs it
  review:
    by: reviewer
    do: "Review the story-level rework against the findings it answers and the spec: it fixes what they ask and nothing else."
    with: { skills: [norn-review] }
    reads: [spec, diff, findings?]
    outcomes:
      approve:
        to: test
        means: "the rework does what the findings and the story ask and nothing else, no blocking findings"
      changes_requested:
        to: implement
        means: "blocking findings, handed back as findings"
        produces: [findings]
  describe:
    by: writer
    do: "Write the PR body to pr.md in the spec folder; norn puts the issue link under it."
    with: { skills: [norn-pr] }
    reads: [spec, diff, record]
    # open-pr reads it; norn done refuses the report while pr.md is missing or empty
    produces: [{ name: pr_body, file: pr.md }]
    outcomes:
      done:
        to: open-pr
        means: "pr.md describes the branch as it is now: summary, evidence, merge danger"
  # a red run's failures become last_check for implement, whose rework goes back through open-pr to the new head
  ship:
    use: ci
    outcomes: { passed: ready, failed: { to: implement, max: 3 }, stale: { to: update, counter: stale_loop } }
  land:
    use: land
    outcomes: { rejected: implement, stale: { to: update, counter: stale_loop }, unpushed: open-pr }
counters:
  # QA's fail and the person's reject at human-qa share one budget
  qa_loop: { max: 2 }
  # a stale re-entry is progress from outside (a sibling merged), bounded by the sibling merges
  stale_loop: { max: 10 }
# `norn story update-branch` re-enters update, not sync (the default would be the first update step); a base move
# without a conflict under a story waiting at ready or merge runs `test` on the merged tree, once per
# base move (no push, no CI): red goes back through update like a conflict
signals: { vcs.stale: { when: conflict, verify: test } }
entries: { update-branch: update }
