# Quick workflow — repo-local copy of the shipped one (label norn:wf:quick), with this repo's
# check commands and its ci.yml wait, its common steps taken from this repo's shared/ files. For refactors, docs, chores, other small changes and the fix of
# a bug `reproduce` confirmed. A story workflow without `slices`: every step works in the story
# worktree. Sync, implement, update, check, review, describe, open the draft PR, wait for its CI, and
# wait for a person at ready, then at merge until the person merges the PR. The local check runs the unit tier and the
# type check; CI runs the integration tier sharded.
name: quick
description: Make a small change (refactor, docs, chore, a reproduced bug's fix), check and review it, open the draft PR, wait for CI.
start: catch-up
steps:
  # brings the story branch up to date with its base before any code is written
  catch-up:
    use: sync
    outcomes: { synced: implement }
  implement:
    agent: >-
      Work from what the story already holds: the Plan section of spec.md when a refinement round wrote one,
      otherwise the issue mirrored in spec.md and its latest `## Triage` comment. Keep to what they ask.
      A change in behaviour gets a test first; a change to docs or a pure refactor needs none beyond the
      suite staying green. A bug comes from a reproduce round with a red loop in the handoff's Notes and
      the issue's latest `## Reproduce` comment: turn it into a failing test at the seam named there before
      changing any code, then fix the cause.
      Test your change with `bun packages/cli/src/main.ts …`, never the installed `norn`.
      Run that dev build only in a throwaway git repo under $TMPDIR, never in this worktree: it is a live norn unit (norn runs its agent with NORN_UNIT set) and a dev build run there would act on its claim and on its run state (state.json, receipts) in the checkout's machine dir.
      Run `bun run test` (the unit tier) after each change, and the type check; the integration tier runs in CI, which the `ci` check waits for, so do not run them before handing back.
    skills: [norn-implement]
    inputs: [spec, handoff, last_check, last_findings]
    outcomes:
      done: update
    means:
      done: "the change is made; each behaviour change and rework point has a passing test"
  base-update:
    use: base-update
    outcomes: { tested: review, failed: implement, merged: open-pr, redescribe: describe }
  review:
    agent: "Review the change against what the story asks (its Plan, or the issue and its latest triage): it does that and nothing else."
    skills: [norn-review]
    inputs: [spec, diff, last_findings]
    hand_back: { changes_requested: findings }
    outcomes:
      approve:           describe
      changes_requested: implement
    means:
      approve: "the change does what the story asks and nothing else, no blocking findings"
      changes_requested: "blocking findings, handed back with --findings <file>"
  describe:
    agent: "Write the PR body to pr.md in the spec folder; norn puts the issue link under it."
    skills: [norn-pr]
    inputs: [spec, diff, handoff]
    outcomes:
      done: open-pr
    means:
      done: "pr.md describes the branch as it is now: summary, evidence, merge danger"
  # a red run's failures become last_check for implement, whose rework goes back through open-pr to the new head
  ship:
    use: ci
    outcomes: { passed: ready, failed: { to: implement, max: 3 }, stale: { to: update, counter: stale_loop } }
  land:
    use: land
    outcomes: { rejected: implement, stale: { to: update, counter: stale_loop }, unpushed: open-pr }
counters:
  # a stale re-entry is progress from outside (a sibling merged), bounded by the sibling merges
  stale_loop: { max: 10 }
# update-branch re-enters update, not sync (the default would be the first update step); a base move
# without a conflict under a story waiting at ready or merge runs `test` on the merged tree, once per
# base move (no push, no CI): red goes back through update like a conflict
base: { stale: conflict, step: update, verify: test }
