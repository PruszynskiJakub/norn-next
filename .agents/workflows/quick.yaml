# Quick workflow — repo-local copy of the shipped one (label norn:wf:quick), with this repo's
# check commands, its common steps taken from shared/ files. For refactors, docs, chores, other small changes and the fix of
# a bug `reproduce` confirmed. A story workflow without `slices`: every step works in the story
# worktree. Sync, implement, update, check, review, describe, open the draft PR, wait for its checks, and
# wait for a person at ready, then at merge until the person merges the PR. The local check runs the unit tier and the
# type check; CI runs the integration tier sharded.
name: quick
description: Make a small change (refactor, docs, chore, a reproduced bug's fix), check and review it, open the draft PR, wait for CI.
start: catch-up
steps:
  # brings the story branch up to date with its base before any code is written
  catch-up:
    use: sync
    outcomes: { synced: implement }
  implement:
    by: builder
    do: >-
      Work from what the story already holds: the Plan section of spec.md when a refinement round wrote one,
      otherwise the issue mirrored in spec.md and its latest `## Triage` comment. Keep to what they ask.
      A change in behaviour gets a test first; a change to docs or a pure refactor needs none beyond the
      suite staying green. A bug comes from a reproduce round with a red loop in the handoff's Notes and
      the issue's latest `## Reproduce` comment: turn it into a failing test at the seam named there before
      changing any code, then fix the cause.
      Test your change with `bun packages/cli/src/main.ts …`, never the installed `norn`.
      Run that dev build only in a throwaway git repo under $TMPDIR, never in this worktree: it is a live norn unit (norn runs its agent with NORN_UNIT set) and a dev build run there would act on its claim and on its run state (state.json, receipts) in the checkout's machine dir.
      Run `bun run test` (the unit tier) after each change, and the type check; the integration tier runs in CI, which the `checks` step waits for, so do not run them before handing back.
    with: { skills: [norn-implement] }
    reads: [spec, handoff, last_check, findings?]
    outcomes:
      done:
        to: update
        means: "the change is made; each behaviour change and rework point has a passing test"
  base-update:
    use: base-update
    outcomes: { tested: review, failed: implement, merged: open-pr, redescribe: publish }
  review:
    by: reviewer
    do: "Review the change against what the story asks (its Plan, or the issue and its latest triage): it does that and nothing else."
    with: { skills: [norn-review] }
    reads: [spec, diff, findings?]
    outcomes:
      approve:
        to: publish
        means: "the change does what the story asks and nothing else, no blocking findings"
      changes_requested:
        to: implement
        means: "blocking findings, handed back as findings"
        produces: [findings]
  # describe, open-pr and the wait for the PR's checks (the pack's shared/publish.yaml); a failed
  # check's whereabouts become last_check for implement, whose rework goes back through open-pr to the new head
  publish:
    use: publish
    outcomes: { passed: land, failed: { to: implement, max: 3 }, stale: { to: update, counter: stale_loop } }
  land:
    use: land
    outcomes: { rejected: implement, stale: { to: update, counter: stale_loop }, unpushed: open-pr }
counters:
  # a stale re-entry is progress from outside (a sibling merged), bounded by the sibling merges
  stale_loop: { max: 10 }
# `norn story update-branch` re-enters update, not sync (the default would be the first update step); a base move
# without a conflict under a story waiting at ready or merge runs `test` on the merged tree, once per
# base move (no push, no CI): red goes back through update like a conflict
signals: { vcs.stale: { when: conflict, verify: test } }
entries: { update-branch: update }
