# Quick workflow — repo-local copy of the shipped one (label norn:wf:quick), with this repo's
# check commands and its ci.yml wait. For refactors, docs, chores, other small changes and the fix of
# a bug `reproduce` confirmed. A story workflow without `slices`: every step works in the story
# worktree. Sync, implement, update, check, review, describe, open the draft PR, wait for its CI, and
# wait for a person at ready, then at merge until the person merges the PR. The local check runs the unit tier and the
# type check; CI runs every tier, integration and e2e sharded.
name: quick
description: Make a small change (refactor, docs, chore, a reproduced bug's fix), check and review it, open the draft PR, wait for CI.
start: sync
steps:
  # brings the story branch up to date with its base before any code is written, so implement starts
  # from the current base and the update after it merges only what moved meanwhile
  sync:
    type: git
    action: update
    outcomes: { done: implement, conflict: { to: sync-resolve, counter: sync_conflict_loop } }
  sync-resolve:
    type: agent
    skill: norn-merge
    inputs: [spec, handoff]
    instructions: "Base mode: merge the base commit named in Rework into the story branch in this worktree, resolve, commit the merge; never rebase."
    outcomes:
      done: { to: sync, means: "base merged into the story branch, conflicts resolved and committed" }
  implement:
    type: agent
    skill: norn-implement
    inputs: [spec, handoff, last_check, last_findings]
    instructions: >-
      Work from what the story already holds: the Plan section of spec.md when a refinement round wrote one,
      otherwise the issue mirrored in spec.md and its latest `## Triage` comment. Keep to what they ask.
      A change in behaviour gets a test first; a change to docs or a pure refactor needs none beyond the
      suite staying green. A bug comes from a reproduce round with a red loop in the handoff's Notes and
      the issue's latest `## Reproduce` comment: turn it into a failing test at the seam named there before
      changing any code, then fix the cause.
      Test your change with `bun packages/cli/src/main.ts …`, never the installed `norn`.
      Run that dev build only in a throwaway git repo under $TMPDIR, never in this worktree: it is a live norn unit (its .norn-unit marker) and a dev build run there would act on its claim and on its run state (state.json, receipts) in the checkout's machine dir.
      Run `bun run test` (the unit tier) after each change, and the type check; the integration and e2e tiers run in CI, which the `ci` check waits for, so do not run them before handing back.
    outcomes:
      done: { to: update, means: "the change is made; each behaviour change and rework point has a passing test" }
  # the light path: when the story holds only base merges and spec-folder bookkeeping (never spec.md)
  # since the round's latest approve, a merge git made alone (clean) or one a resolver finished
  # (resolved) skips implement and the full review and describe; anything else is done, the full path
  update:
    type: git
    action: update
    outcomes:
      done: test
      clean: test-merge
      resolved: test-resolution
      conflict: { to: resolve, counter: base_conflict_loop }
  resolve:
    type: agent
    skill: norn-merge
    inputs: [spec, handoff, base_side]
    instructions: "Base mode: merge the base commit named in Rework into the story branch in this worktree, resolve, commit the merge; never rebase. When Rework holds the resolution review's findings instead, fix the resolution they name and commit; never rebase."
    outcomes:
      done: { to: update, means: "base merged into the story branch, conflicts resolved and committed" }
  test:
    type: check
    run: &test-run "bun install --frozen-lockfile && bun run test && bun run typecheck"
    timeout: 15m
    outcomes: { pass: review, fail: { to: implement, counter: test_loop } }
  # the light path's tests run the same command (the anchor above); red is implement's work, which
  # then takes the full path
  test-merge:
    type: check
    run: *test-run
    timeout: 15m
    outcomes: { pass: open-pr, fail: { to: implement, counter: test_loop } }
  test-resolution:
    type: check
    run: *test-run
    timeout: 15m
    outcomes: { pass: resolution-review, fail: { to: implement, counter: test_loop } }
  # reviews only what the resolver changed (each merge's remerge-diff), never the whole story again
  resolution-review:
    type: agent
    skill: norn-review
    inputs: [spec, resolution]
    instructions: >-
      Review only the resolution: each remerge-diff under Inputs is where a merge differs from git's own
      merge of its parents, a base change the resolver dropped included. Judge whether it keeps the intent
      of both sides. Report `redescribe` when the merge danger pr.md describes no longer holds.
    outcomes:
      approve:           { to: open-pr, means: "the resolution keeps both sides' intent, no blocking findings; pr.md still describes the merge danger" }
      redescribe:        { to: describe, means: "the resolution is sound, but the merge danger pr.md describes changed" }
      changes_requested: { to: resolve, counter: resolution_loop, means: "blocking findings on the resolution in the receipt" }
  review:
    type: agent
    skill: norn-review
    inputs: [spec, diff, last_findings]
    outcomes:
      approve:           { to: describe, means: "the change does what the story asks and nothing else, no blocking findings" }
      changes_requested: { to: implement, counter: review_loop, means: "blocking findings in the receipt" }
  describe:
    type: agent
    skill: norn-pr
    inputs: [spec, diff, handoff]
    instructions: "Write the PR body to pr.md in the spec folder; norn puts the issue link under it."
    outcomes:
      done: { to: open-pr, means: "pr.md describes the branch as it is now: summary, evidence, merge danger" }
  open-pr:
    type: git
    action: open-pr
    outcomes: { done: ci }
  # waits for the PR's CI (a detached check run, so the tick is not blocked): the ci.yml run of the
  # PR's head commit, up to 5m for it to appear, else fail; where a red run's failures are
  # becomes last_check for implement, whose rework goes back through open-pr to the new head
  ci:
    type: check
    run: |
      sha=$(gh pr view --json headRefOid -q .headRefOid) || exit 1
      # GitHub starts no CI run on a PR that conflicts with its base: exit 3 is stale, the story
      # updates its branch instead of waiting. UNKNOWN is GitHub still computing: asked again briefly.
      mergeable() {
        m=UNKNOWN
        for i in 1 2 3 4 5 6; do
          m=$(gh pr view --json mergeable -q .mergeable) || return 1
          [ "$m" != UNKNOWN ] && return 0
          sleep 5
        done
      }
      conflicting() { [ "$m" = CONFLICTING ] && echo "PR conflicts with its base: no CI runs on it until the branch takes the base"; }
      mergeable || exit 1
      conflicting && exit 3
      run=
      for i in $(seq 1 30); do
        run=$(gh run list --workflow ci.yml --commit "$sha" --event pull_request --limit 1 --json databaseId -q '.[0].databaseId')
        [ -n "$run" ] && break
        sleep 10
      done
      if [ -z "$run" ]; then
        mergeable || exit 1
        conflicting && exit 3
        echo "no ci.yml run for $sha after 5m (PR mergeable: $m)"
        exit 1
      fi
      gh run watch "$run" --exit-status --interval 30 >/dev/null && exit 0
      sh .agents/scripts/ci-failures.sh "$run"
      exit 1
    timeout: 30m
    exits: { 3: stale }
    outcomes: { pass: ready, fail: { to: implement, counter: ci_loop }, stale: { to: update, counter: stale_loop } }
  ready:
    type: gate
    prompt: "Read the draft PR. Approve to wait for the merge (a person merges the PR), or reject with what to change."
    outcomes:
      approve: merge
      reject:  { to: implement, counter: ready_loop }
      stale:   { to: update, counter: stale_loop }
  # a story past ready waits here for a person to merge its PR; the merge ends the story, and a base
  # move it counts as stale (base.stale) sends it back through update by itself
  merge:
    type: merge
    outcomes:
      stale: { to: update, counter: stale_loop }
counters:
  test_loop: { max: 5 }
  ci_loop: { max: 3 }
  review_loop: { max: 3 }
  ready_loop: { max: 2 }
  # reset each time their update merges cleanly (on either path): only repeated conflicts on one base move count
  sync_conflict_loop: { max: 2, reset_on: sync.done }
  base_conflict_loop: { max: 2, reset_on: [update.done, update.clean, update.resolved] }
  resolution_loop: { max: 2 }
  # a stale re-entry is progress from outside (a sibling merged), bounded by the sibling merges
  stale_loop: { max: 10 }
# update-branch re-enters update, not sync (the default would be the first update step); a base move
# without a conflict under a story waiting at ready or merge runs `test` on the merged tree, once per
# base move (no push, no CI): red goes back through update like a conflict
base: { stale: conflict, step: update, verify: test }
