# Opens the draft PR and waits for its CI. Exits: `passed` (the run is green), `failed` (the run is
# red, or never appeared; where its failures are becomes last_check), `stale` (the PR conflicts with
# its base, so GitHub starts no CI run on it: the branch takes the base instead of waiting).
description: Open the draft PR and wait for its ci.yml run.
start: open-pr
steps:
  open-pr:
    by: forge.open-pr
    outcomes: { done: ci }
  # waits for the PR's CI (a detached check run, so the tick is not blocked): the ci.yml run of the
  # PR's head commit, up to 5m for it to appear, else fail: tests, typecheck, the npm package and a
  # binary built and smoke-tested
  ci:
    by: shell
    do: |
      sha=$(gh pr view --json headRefOid -q .headRefOid) || exit 1
      # GitHub starts no CI run on a PR that conflicts with its base: exit 3 is stale, the story
      # updates its branch instead of waiting. UNKNOWN is GitHub still computing: asked again briefly.
      mergeable() {
        m=UNKNOWN
        for i in 1 2 3 4 5 6; do
          m=$(gh pr view --json mergeable -q .mergeable) || return 1
          [ "$m" != UNKNOWN ] && return 0
          sleep 5
        done
      }
      conflicting() { [ "$m" = CONFLICTING ] && echo "PR conflicts with its base: no CI runs on it until the branch takes the base"; }
      mergeable || exit 1
      conflicting && exit 3
      run=
      for i in $(seq 1 30); do
        run=$(gh run list --workflow ci.yml --commit "$sha" --event pull_request --limit 1 --json databaseId -q '.[0].databaseId')
        [ -n "$run" ] && break
        sleep 10
      done
      if [ -z "$run" ]; then
        mergeable || exit 1
        conflicting && exit 3
        echo "no ci.yml run for $sha after 5m (PR mergeable: $m)"
        exit 1
      fi
      gh run watch "$run" --exit-status --interval 30 >/dev/null && exit 0
      sh .agents/scripts/ci-failures.sh "$run"
      exit 1
    limits: { timeout: 30m }
    with: { exits: { 3: stale } }
    outcomes: { pass: { exit: passed }, fail: { exit: failed }, stale: { exit: stale } }
