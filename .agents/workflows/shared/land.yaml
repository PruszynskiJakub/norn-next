# A person reads the draft PR at ready, then merges it; the merge ends the story. Exits: `rejected`
# (the person wants changes), `stale` (the base moved under the story: it goes back through its base
# update), `unpushed` (the story branch holds commits its PR lacks: they go out through open-pr).
description: Wait for a person at ready, then for the PR's merge.
start: ready
steps:
  ready:
    gate: "Read the draft PR. Approve to wait for the merge (a person merges the PR), or reject with what to change."
    outcomes:
      approve: merge
      reject:  { exit: rejected }
      stale:   { exit: stale }
      unpushed: { exit: unpushed }
  # a story past ready waits here for a person to merge its PR; the merge ends the story, and a base
  # move it counts as stale (base.stale) leaves through `stale` by itself
  merge:
    await-merge:
    outcomes:
      merged: $done
      stale: { exit: stale }
      unpushed: { exit: unpushed }
