# norn's own default round for a new issue; a bug starts in reproduce instead. Next round: the one its
# outcome names (`norn story round <story> --workflow refinement|quick|reproduce|fix`); after close, a person closes it.
name: triage
description: Check an issue still holds, add its context, and end with the next round it recommends (refinement, quick, reproduce, fix) or closing it.
start: explore
steps:
  explore:
    by: investigator
    do: >-
      The issue is mirrored in spec.md. A change to norn's documented behaviour is a `refinement`, unless
      the change is small and settled. Post the `## Triage` comment on it and add the kind, risk and priority
      labels: `norn:kind:bug|feature|security|chore|docs`, `norn:risk:low|medium|high`,
      `norn:priority:low|medium|high|extreme`; a label missing on the remote is named in the comment
      for a person to create. That comment and those labels are the only remote writes this step allows,
      an exception to the brief's rule on remote writes; never remove a label, the intake label `norn` included. Change no file, spec.md included,
      but the handoff. Recommend from the workflow catalog (each workflow's `when:`), not a list of your own. Report the outcome the comment recommends, with its reason as the note:
      `norn done <recommendation> --note "<reason>"`.
    with: { skills: [norn-triage] }
    reads: [spec, handoff]
    outcomes:
      refinement:
        to: $done
        means: "the ## Triage comment and the labels that could be set are posted; it needs a spec and a plan agreed with a person before anyone builds it"
      quick:
        to: $done
        means: "the ## Triage comment and the labels that could be set are posted; a small change with no open design question"
      reproduce:
        to: $done
        means: "the ## Triage comment and the labels that could be set are posted; a bug whose cause is confirmed before anyone decides how to fix it"
      fix:
        to: $done
        means: "the ## Triage comment and the labels that could be set are posted; a bug to reproduce and fix in one round, its fix small and settled"
      close:
        to: $done
        means: "the ## Triage comment and the labels that could be set are posted; it no longer applies, is a duplicate or out of scope, for a person to close"
