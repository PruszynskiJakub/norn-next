# Reproduce workflow — repo-local copy of the shipped one (W1, W9: label norn:wf:reproduce, set by
# the bug report template and the `issue` skill). An unattended agent follows the report through the
# real interface, builds a loop that goes red on the symptom, minimises it, confirms the cause and
# names the seam for a regression test. It posts all of that as an issue comment and changes no code.
# Every outcome ends the round ($done): the fix is a quick round (`norn story edit gh-N --workflow
# quick`), whose implement turns the red loop into a failing test first.
name: reproduce
description: Reproduce a bug through the real interface, confirm its cause and the seam for a regression test; change no code.
start: reproduce
steps:
  reproduce:
    type: agent
    skill: norn-diagnose
    inputs: [spec, handoff]
    instructions: >-
      The issue is mirrored in spec.md; read its comments too. First follow the report as a user, through
      the real interface (`bun packages/cli/src/main.ts …` after `bun install --frozen-lockfile`, never the installed
      `norn`), and record what you saw. Run that dev build only in a throwaway git repo under $TMPDIR, never in this worktree: it is a live norn unit (NORN_HOME points at it) and a dev build would act on its runs/, claim and state.json. Then build a loop
      that goes red on that exact symptom, minimise it and confirm the cause. You are told not to fix:
      change no file, spec.md included, but the handoff.
      Post the findings as an issue comment that starts with `## Reproduce` (`## Reproduce (updated)` on a rerun):
      the loop command, the minimised repro, what it prints, the confirmed cause (`file:line`, or the ranked
      hypotheses left), the PRD ids it touches and the seam for a regression test. That one comment is the only remote write this
      step allows, an exception to the norn skill's rule; never edit the issue, label, assign or close.
      Write the same under Progress in the handoff (the next agent does not see your Resume).
    outcomes:
      reproduced:       { to: $done, means: "the bug was observed as a user and a loop goes red on it; loop, repro, cause and seam posted and in the handoff" }
      cannot_reproduce: { to: $done, means: "followed the report faithfully and the bug did not occur, nor in any loop tried; what was tried posted and in the handoff" }
