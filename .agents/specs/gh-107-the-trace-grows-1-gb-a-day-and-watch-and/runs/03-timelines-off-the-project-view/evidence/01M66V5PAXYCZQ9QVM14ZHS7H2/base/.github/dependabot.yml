# Monthly, one grouped PR per ecosystem; CI (.github/workflows/ci.yml) gates each one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ["*"]
