# The unit tier: a plain `bun test` runs everything but the integration tier, which runs through its
# own config (bunfig.integration.toml). Only this tier preloads the unit guard: a unit test that starts
# a child process fails.
[test]
preload = ["./test/preload.ts", "./test/support/unit-guard-preload.ts"]
pathIgnorePatterns = ["**/integration/**"]
